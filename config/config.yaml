# =============================================================================
# coding_agent — system configuration
# =============================================================================
# Set provider + model here. The actual API key is NEVER put in this file —
# it lives in .env (see .env.example) so it never gets committed to git.
#
# PROVIDER          KEY GOES IN .env AS    EXAMPLE MODELS
# -----------       -------------------    -----------------------------------
# openrouter        OPENROUTER_API_KEY     openai/gpt-4o, anthropic/claude-sonnet-4-6
# anthropic         ANTHROPIC_API_KEY      claude-sonnet-4-6, claude-haiku-4-5-20251001
#
# To switch to direct Anthropic:
#   1. Add to .env:  ANTHROPIC_API_KEY=sk-ant-...
#   2. Set provider: anthropic and model: claude-sonnet-4-6 below
# =============================================================================

# ---- Provider ---------------------------------------------------------------
provider: openrouter
model: google/gemini-2.5-flash-lite
# For Anthropic Claude (uncomment and set ANTHROPIC_API_KEY):
# provider: anthropic
# model: claude-sonnet-4-6
temperature: 0.7
max_tokens: 10000

# ---- Generation -------------------------------------------------------------
num_questions: 2
difficulty_distribution:
  easy: 0.30
  medium: 0.50
  hard: 0.20
over_generation_factor: 1.0
max_regeneration_attempts: 2

# ---- Coverage ---------------------------------------------------------------
# Coverage is a TARGET fraction, not an implicit 100% gate. Generation is
# coverage-driven (each slot is aimed at an uncovered syllabus skill) and, when
# auto_scale_questions is on, num_questions is raised toward the skill count
# (capped at max_questions) so the target is actually reachable. This is the fix
# for "broad syllabus ⇒ supervisor REJECTED by construction".
coverage_target: 0.85
auto_scale_questions: false
max_questions: 14

# ---- Concurrency ------------------------------------------------------------
# Per-slot generation runs on a thread pool, not a serial loop. Each worker is
# one blocking provider call. Raise for higher throughput on hosted APIs.
generation_concurrency: 4
generation_batch_size: 2        # generate and validate N questions at a time

# ---- Autonomy / planner -----------------------------------------------------
# The run is driven by a PlannerAgent (observe → decide → act), not a fixed
# sequence. It loops generate → validate → reflect → regenerate until the quality
# bar is met or the budget is spent.
agentic_mode: true
max_planner_steps: 8          # hard ceiling on control-loop ticks (safety)

quality_bar:
  min_confidence: 50.0
  # IN-LOOP judge: PlannerAgent runs this after each validate round.
  # Controls whether the planner batch-judge must APPROVE before a question passes.
  # Distinct from enable_llm_judge (supervisor, post-loop, disabled by default).
  require_judge_approve: false
  max_similarity: 0.85
  require_in_scope: true
  min_difficulty_fit: 0.6

# ---- Quality gates ----------------------------------------------------------
similarity_reject_threshold: 0.85

# ---- Originality recency window ---------------------------------------------
# When checking a new question against the vectorstore for near-duplicates,
# only compare it against questions generated within this many days (e.g. 5
# means "compare against anything generated from 5 days ago until now").
# Set to 0 to compare against the entire history instead (no date filtering).
# Entries with no recorded generation date (older/legacy data) are ALWAYS
# included regardless of this setting — "no date mentioned" falls back to
# comparing against everything rather than silently skipping them.
originality_lookback_days: 5

# ---- Confidence gate (single source of truth — see ConfidenceScoringAgent) --
# auto_grading removed: no sandbox execution ever runs in this pipeline (the
# reference/starter package is handed to the author to write by hand), so it
# had no real signal to score. Its former 60-point weight is redistributed
# evenly across the remaining five components below (sum = 100).
#
# min_confidence_score is THE PASS BAR — a question needs a confidence score
# >= this number (out of 100, and no hard blockers like empty evaluation
# criteria or a near-duplicate) to be marked APPROVED. Raise this to demand
# higher-quality questions; lower it to let more through.
min_confidence_score: 50.0
confidence_weights:
  coverage: 20
  difficulty: 20
  originality: 20
  format_quality: 20
  eval_calibration: 20

# ---- Supervisor (final-audit gate) ------------------------------------------
supervisor_min_validation_score: 75

critic_batch_size: 10

# ---- Sources ----------------------------------------------------------------
chunk_size: 1000
chunk_overlap: 100
top_k: 3

# ---- Storage / logging ------------------------------------------------------
log_level: INFO
log_db_path: logs/runs.db
memory_db_path: memory/memory.db
vectorstore_path: vectorstore/index.json
prompts_dir: prompts
outputs_dir: outputs
reports_dir: reports

# ---- Per-agent model overrides -----------------------------------------------
# Use a different model for each role. Falls back to `model` if not set.
# Uncomment and edit to activate. Any agent name can be overridden.
#
# NOTE: the supervisor's override key MUST be "supervisor_judge" (not
# "supervisor") — that's the exact agent name orchestrator.py looks up when
# building the Supervisor's LLM client. Using "supervisor" here is a silent
# no-op (the key is simply never read).
agent_models:
  question_generator: google/gemini-2.5-flash-lite        # generation — keep slightly better
  skill_triage:       google/gemini-2.5-flash-lite    # cheapest — triage + skill picking
  difficulty_agent:   google/gemini-2.5-flash-lite    # cheapest — critic
  supervisor_judge:   google/gemini-2.5-flash-lite    # cheapest — gatekeeper
  md_summary:         google/gemini-2.5-flash-lite    # cheapest — summariser

# ---- Human review (mid-run) -------------------------------------------------
# When enabled, borderline questions (confidence 82–87%) are surfaced to a human
# before the final Supervisor verdict.  Three modes:
#   log   — write pending_review.json and continue (borderlines treated as approved)
#   defer — exclude borderlines from the package; they appear in pending_review.json
#   block — halt the run, write pending_review.json, exit code 2.
#           On the NEXT run with the same --md, approved decisions are restored.
#
# For post-run manual review without mid-run interruption, use instead:
#   coding-agent review outputs/<run_dir>/
# That command records instructor approve/reject to calibration/observations.jsonl
# weighted 3× over auto-generated grading labels (improves confidence EMA faster).
human_review_enabled: true
human_review_mode: log          # log | defer | block
human_review_confidence_min: 82.0
human_review_confidence_max: 87.0

# ---- Pricing (cost reporting only) ------------------------------------------
# Reflects the primary model (question_generator + supervisor).
# Critics run on cheaper models (gpt-4.1-mini, gemini-2.5-flash-lite) via the
# agent_models overrides above. The token_counter prices each call by its OWN
# model, so the real run cost is lower than these primary-model rates suggest.
#   openai/gpt-4.1               : $2.00 / $8.00   (primary — generator + supervisor)
#   openai/gpt-4.1-mini          : $0.40 / $1.60   (difficulty, eval, md_summary)
#   google/gemini-2.5-flash-lite : $0.10 / $0.40   (skill_triage, scope_quality)
#   openai/gpt-4o                : $2.50 / $10.00
#   anthropic/claude-sonnet-4-6  : $3.00 / $15.00
pricing:
  input_per_million_tokens: 0.10
  output_per_million_tokens: 0.40
