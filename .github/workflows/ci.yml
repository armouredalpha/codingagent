name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  test:
    name: Test (Python 3.11)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install --no-build-isolation -e ".[dev]"

      - name: Import check
        run: |
          python -c "import coding_agent"
          python -c "from coding_agent.agents.orchestrator import Orchestrator"
          python -c "from coding_agent.agents.confidence_agent import ConfidenceScoringAgent"
          python -c "from coding_agent.tools.registry import ToolRegistry"
          python -c "from coding_agent.cli import main"

      - name: Run tests
        env:
          # Satisfies Settings.load() provider-key validation without live API calls.
          # No test makes a real LLM request — all orchestrator tests mock or use
          # tmp_settings which bypasses Settings.load() entirely.
          OPENROUTER_API_KEY: test-key-ci
        run: pytest -q tests/

  docker-build:
    name: Build Docker image
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Build generator image
        run: docker build -t coding-agent:ci .
