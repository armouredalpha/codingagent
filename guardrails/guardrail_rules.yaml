boilerplate:
  require_todo_start_marker: true
  require_todo_end_marker: true
  require_balanced_markers: true
  require_reference_differs_from_starter: true
  reference_must_not_contain_todo: true
  action_on_fail: REJECT
scope:
  gated_technologies:
    nav2:
    - nav2
    - navigation2
    - nav2_msgs
    - nav_msgs/Path
    slam:
    - slam
    - slam_toolbox
    - cartographer
    - gmapping
    moveit:
    - moveit
    - move_group
    - moveit2
    opencv:
    - opencv
    - cv2
    - cv_bridge
    micro_ros:
    - micro-ros
    - micro_ros
    perception:
    - point cloud
    - pointcloud
    - pcl
    - sensor_fusion
    action:
    - action_msgs
    - rclpy.action
    - SimpleActionClient
    lifecycle:
    - LifecycleNode
    - lifecycle_msgs
    - managed_node
  action_on_violation: REJECT
originality:
  similarity_reject_threshold: 0.75
  compare_against_existing_bank: true
  compare_within_batch: true
  compare_against_memory: true
  action_on_duplicate: REJECT
difficulty:
  easy_max_skills: 1
  easy_max_solution_loc: 35
  medium_max_skills: 3
  medium_max_solution_loc: 90
  bloom_to_difficulty:
    remember: easy
    understand: easy
    apply: medium
    analyze: medium
    evaluate: hard
    create: hard
  action_on_mismatch: WARN
realism:
  min_score: 60
  required_domains:
  - warehouse
  - inspection
  - factory
  - delivery
  - rover
  - conveyor
  - patrol
  toy_phrases_penalty:
  - hello world
  - foo
  - bar
  - example_topic
  - test_node
  - lorem
  action_on_low_score: WARN
grading:
  require_auto_gradable: true
  min_hidden_checks: 3
  min_hidden_tests: 3
  required_test_kinds:
  - positive
  - negative
  - edge
  action_on_fail: REJECT
confidence:
  min_confidence_score: 50.0
  weights:
    coverage: 10
    difficulty: 10
    originality: 10
    auto_grading: 76
    format_quality: 10
  hard_blockers:
  - not_auto_gradable
  - similarity_above_threshold
supervisor:
  min_validation_score: 75
  require_full_coverage: false
  coverage_target: 0.85
  require_at_least_one_approved: true
  no_approved_with_scope_violations: true
  no_approved_non_auto_gradable: true
  action_on_fail: REJECT_BATCH
