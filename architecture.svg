<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 2600" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#555"/>
    </marker>
    <marker id="arrowRed" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#b3261e"/>
    </marker>
  </defs>

  <style>
    .box { stroke:#333; stroke-width:1.5; }
    .agent { fill:#dbe9fe; }
    .tool { fill:#fde9c8; }
    .api { fill:#fbdcdc; }
    .gate { fill:#d9f2e3; }
    .terminal { fill:#eceff1; }
    .lbl { font-size:14px; fill:#111; }
    .small { font-size:12.5px; fill:#222; }
    .tiny { font-size:11px; fill:#444; }
    .title { font-size:26px; font-weight:700; fill:#111; }
    .subtitle { font-size:14px; fill:#555; }
    .h2 { font-size:16px; font-weight:700; fill:#0d1b2a; }
    .flowlabel { font-size:12.5px; font-weight:700; fill:#b3261e; }
    .edge { stroke:#555; stroke-width:1.8; fill:none; marker-end:url(#arrow); }
    .edgeRed { stroke:#b3261e; stroke-width:1.8; fill:none; marker-end:url(#arrowRed); stroke-dasharray:6,4; }
  </style>

  <rect width="1600" height="2600" fill="#ffffff"/>

  <!-- HEADER -->
  <text x="40" y="45" class="title">Coding-Agent — Multi-Agent Architecture</text>
  <text x="40" y="70" class="subtitle">coding-agent generate --md configs/&lt;file&gt;.md   ·   entry: cli.py → Orchestrator → LangGraph state machine</text>

  <!-- LEGEND -->
  <g transform="translate(40,90)">
    <rect width="18" height="18" class="box agent"/><text x="24" y="14" class="small">Agent</text>
    <rect x="100" width="18" height="18" class="box tool"/><text x="124" y="14" class="small">Tool call</text>
    <rect x="220" width="18" height="18" class="box api"/><text x="244" y="14" class="small">External API</text>
    <rect x="360" width="18" height="18" class="box gate"/><text x="384" y="14" class="small">Quality / grading gate</text>
    <rect x="560" width="18" height="18" class="box terminal"/><text x="584" y="14" class="small">CLI / I-O</text>
    <line x1="680" y1="9" x2="720" y2="9" class="edge"/><text x="726" y="14" class="small">normal flow</text>
    <line x1="860" y1="9" x2="900" y2="9" class="edgeRed"/><text x="906" y="14" class="small">control-loop branch</text>
  </g>

  <!-- ROW 0: CLI -->
  <rect x="40" y="130" width="1520" height="60" rx="10" class="box terminal"/>
  <text x="60" y="155" class="h2">cli.py generate</text>
  <text x="60" y="175" class="small">Settings.load() (.env → YAML → env overrides → API key)  →  Orchestrator() builds every agent + clients  →  loop up to --max-loops: run_from_md() → graph.invoke()</text>

  <!-- ROW 1: build_context / retrieve_context / generate / tools -->
  <rect x="40" y="220" width="330" height="170" rx="10" class="box agent"/>
  <text x="58" y="246" class="h2">1. build_context</text>
  <text x="58" y="268" class="small">MdSummaryAgent</text>
  <text x="58" y="286" class="tiny">cached by md-hash; else 1 LLM call</text>
  <text x="58" y="308" class="small">MdParserAgent (rule-based)</text>
  <text x="58" y="326" class="tiny">→ SkillEntry list</text>
  <text x="58" y="344" class="tiny">→ CoverageMatrix + SkillGraph</text>
  <text x="58" y="366" class="tiny">stored in orch._run_contexts[run_id]</text>

  <rect x="410" y="220" width="330" height="170" rx="10" class="box agent"/>
  <text x="428" y="246" class="h2">2. retrieve_context</text>
  <text x="428" y="268" class="small">ContextRetrievalAgent</text>
  <text x="428" y="286" class="tiny">RAG: past exemplars + dedup hashes</text>
  <text x="428" y="304" class="tiny">+ cross-run skill_usage_history (Memory)</text>
  <text x="428" y="326" class="small">SkillTriageAgent — 1 LLM call</text>
  <text x="428" y="344" class="tiny">complexity triage + skill/domain/</text>
  <text x="428" y="360" class="tiny">question-type selection</text>
  <text x="428" y="378" class="tiny">builds ToolRegistry for step 3</text>

  <rect x="780" y="220" width="380" height="170" rx="10" class="box agent"/>
  <text x="798" y="246" class="h2">3. generate — QuestionGeneratorAgent</text>
  <text x="798" y="268" class="small">Plans coverage-driven slots</text>
  <text x="798" y="284" class="tiny">(skill × difficulty × domain × question-type)</text>
  <text x="798" y="304" class="small">Fans out 1 LLM call per slot</text>
  <text x="798" y="320" class="tiny">ThreadPoolExecutor, generation_concurrency = 4</text>
  <text x="798" y="340" class="small">Parses 3-block response:</text>
  <text x="798" y="356" class="tiny">JSON spec / starter code / reference solution</text>
  <text x="798" y="374" class="tiny">May call tools during generation →</text>

  <rect x="1200" y="220" width="360" height="170" rx="10" class="box tool"/>
  <text x="1218" y="246" class="h2">Tools available to generator</text>
  <text x="1218" y="266" class="small">check_similarity → local vectorstore</text>
  <text x="1218" y="284" class="small">query_skill_graph → in-memory graph</text>
  <text x="1218" y="302" class="small">estimate_difficulty → local heuristic</text>
  <text x="1218" y="320" class="small" fill="#8a1f1f">fetch_ros2_docs → Context7 API</text>
  <text x="1218" y="338" class="small" fill="#8a1f1f">search_course_exercises → Tavily/Exa API</text>
  <text x="1218" y="356" class="small" fill="#8a1f1f">fetch_course_content → web fetch</text>
  <text x="1218" y="374" class="small">submit_question → terminal tool call</text>

  <!-- ROW 2: LLM API bar -->
  <rect x="780" y="420" width="780" height="60" rx="10" class="box api"/>
  <text x="798" y="445" class="h2">LLM API layer (llm_client.py)</text>
  <text x="798" y="465" class="tiny">OpenRouter (openai/*, google/*) or native Anthropic API · every agent call above is priced per-model and logged to outputs/usage_history.jsonl</text>

  <!-- ROW 3: validate -->
  <rect x="40" y="520" width="1000" height="300" rx="10" class="box gate"/>
  <text x="60" y="548" class="h2">4. validate  (runs on every question, each pass through the loop)</text>

  <rect x="60" y="565" width="460" height="60" rx="6" fill="#ffffff" class="box"/>
  <text x="75" y="586" class="small">DifficultyAgent (LLM critic)</text>
  <text x="75" y="604" class="tiny">declared difficulty vs actual solution complexity</text>

  <rect x="540" y="565" width="460" height="60" rx="6" fill="#ffffff" class="box"/>
  <text x="555" y="586" class="small">OriginalityAgent</text>
  <text x="555" y="604" class="tiny">cosine similarity vs vectorstore; hard-reject if &gt; 0.60</text>

  <rect x="60" y="635" width="940" height="50" rx="6" fill="#ffffff" class="box"/>
  <text x="75" y="656" class="small">SupervisorAgent.compare_to_eval_bank() — scores this question against evaluations/question.json</text>

  <rect x="60" y="695" width="940" height="60" rx="6" fill="#c8ecd6" class="box"/>
  <text x="75" y="716" class="small" font-weight="700">ConfidenceAgent → 0–100 score = coverage(20) + difficulty(20) + originality(20) + format_quality(20) + eval_calibration(20)</text>
  <text x="75" y="736" class="small" font-weight="700">PASS BAR: min_confidence_score = 80.0</text>

  <rect x="60" y="765" width="940" height="44" rx="6" fill="#ffffff" class="box"/>
  <text x="75" y="792" class="tiny">optional HumanReviewAgent — confidence 82–87% surfaced to a human (modes: log / defer / block)</text>

  <!-- Quality gate box, right side -->
  <rect x="1080" y="520" width="480" height="300" rx="10" class="box gate"/>
  <text x="1100" y="548" class="h2">5. Quality-bar gate</text>
  <text x="1100" y="548" class="h2" dx="0"/>
  <text x="1100" y="570" class="small">PlannerAgent.evaluate_quality() — ALL required:</text>
  <text x="1100" y="596" class="tiny">• min_confidence ≥ 80.0</text>
  <text x="1100" y="618" class="tiny">• max_similarity ≤ 0.60</text>
  <text x="1100" y="640" class="tiny">• require_in_scope = true</text>
  <text x="1100" y="662" class="tiny">  (must map to a real syllabus skill)</text>
  <text x="1100" y="684" class="tiny">• min_difficulty_fit ≥ 0.6</text>
  <text x="1100" y="706" class="tiny">• require_judge_approve = false</text>
  <text x="1100" y="722" class="tiny">  (in-loop judge optional, off by default)</text>
  <rect x="1100" y="740" width="440" height="60" rx="6" fill="#ffffff" class="box"/>
  <text x="1115" y="762" class="small" font-weight="700">PASS → accumulated_questions</text>
  <text x="1115" y="782" class="small" font-weight="700" fill="#b3261e">FAIL → reflect / regenerate loop</text>

  <!-- ROW 4: planner.decide -->
  <rect x="40" y="860" width="1520" height="70" rx="10" class="box agent"/>
  <text x="60" y="888" class="h2">6. planner.decide()  — deterministic control-loop router</text>
  <text x="60" y="910" class="small">REGENERATE (failures remain, budget left)   ·   NEXT_BATCH (batch passed, more slots needed)   ·   FINALIZE (done / budget exhausted)</text>

  <!-- ROW 5: reflect / regenerate branch (left) vs supervise (right) -->
  <rect x="40" y="960" width="460" height="140" rx="10" class="box agent"/>
  <text x="58" y="988" class="h2">7a. reflect — PlannerAgent</text>
  <text x="58" y="1010" class="small">Deterministic failed-check strings</text>
  <text x="58" y="1028" class="tiny">2+ issues → LLM critique (_llm_critic_diagnose)</text>
  <text x="58" y="1046" class="tiny">otherwise → batched critic (critic_batch_size = 10)</text>
  <text x="58" y="1068" class="tiny">produces per-question fix directive</text>
  <text x="58" y="1086" class="tiny">→ passed to regenerate</text>

  <rect x="540" y="960" width="460" height="140" rx="10" class="box agent"/>
  <text x="558" y="988" class="h2">7b. regenerate — QuestionGeneratorAgent</text>
  <text x="558" y="1010" class="small">Replaces ONLY the failing questions</text>
  <text x="558" y="1028" class="tiny">(accumulated_questions are never touched)</text>
  <text x="558" y="1046" class="tiny">injects planner feedback into the prompt</text>
  <text x="558" y="1068" class="tiny" font-weight="700">bounded: max_regeneration_attempts = 2</text>
  <text x="558" y="1086" class="tiny">→ loops back to validate (step 4)</text>

  <rect x="1080" y="960" width="480" height="200" rx="10" class="box gate"/>
  <text x="1100" y="988" class="h2">8. supervise — final package audit</text>
  <text x="1100" y="1010" class="small">merges accumulated_questions + remainder → AssessmentPackage</text>
  <text x="1100" y="1030" class="small" font-weight="700">gate: supervisor_min_validation_score ≥ 75</text>
  <text x="1100" y="1050" class="small" font-weight="700">gate: coverage_target ≥ 0.85 of syllabus skills</text>
  <text x="1100" y="1070" class="small">requires ≥ 1 approved question, else REJECTED</text>
  <text x="1100" y="1090" class="tiny">optional post-loop LLM judge (enable_llm_judge, off by default)</text>
  <text x="1100" y="1112" class="tiny">orch._attach_costs() → per-question token/cost</text>
  <text x="1100" y="1134" class="small" font-weight="700">verdict: APPROVED / REJECTED</text>
  <text x="1100" y="1154" class="tiny">only APPROVED questions are persisted →</text>

  <!-- ROW 6: memory / vectorstore -->
  <rect x="1080" y="1220" width="230" height="100" rx="10" class="box api"/>
  <text x="1096" y="1246" class="h2">Memory (SQLite)</text>
  <text x="1096" y="1266" class="tiny">few-shot store,</text>
  <text x="1096" y="1282" class="tiny">question-stem memory,</text>
  <text x="1096" y="1298" class="tiny">skill-usage-history</text>

  <rect x="1330" y="1220" width="230" height="100" rx="10" class="box api"/>
  <text x="1346" y="1246" class="h2">Vectorstore</text>
  <text x="1346" y="1266" class="tiny" fill="#8a1f1f">Qdrant API (QDRANT_API_KEY)</text>
  <text x="1346" y="1282" class="tiny">or local vectorstore/index.json</text>
  <text x="1346" y="1298" class="tiny">payload: status = approved/rejected</text>

  <!-- ROW 7: export -->
  <rect x="40" y="1220" width="1000" height="100" rx="10" class="box terminal"/>
  <text x="60" y="1248" class="h2">9. export_run_v2 (workflows/assessment_workflow.py)</text>
  <text x="60" y="1270" class="small">outputs/&lt;run&gt;/questions/Q*/question.yaml + solution.yaml + boilerplate/grading artifacts</text>
  <text x="60" y="1290" class="small">If REJECTED and loops remain → prompt user → repeat from step 1 (resume_id cleared after loop 1)</text>
  <text x="60" y="1310" class="small" font-weight="700">CLI exit: 0 = APPROVED · 2 = REJECTED/exhausted · 1 = fatal error</text>

  <!-- ROW 8: safety bounds -->
  <rect x="40" y="1360" width="1520" height="90" rx="10" class="box terminal"/>
  <text x="60" y="1386" class="h2">Control-loop safety bounds (config/config.yaml)</text>
  <text x="60" y="1408" class="small">max_regeneration_attempts = 2 (per failing question) · max_planner_steps = 8 (hard ceiling, whole run) · generation_concurrency = 4</text>
  <text x="60" y="1428" class="small">similarity_reject_threshold = 0.60 (hard reject) · accumulated_questions are NEVER re-validated once passed</text>

  <!-- GRADING DETAIL PANEL -->
  <rect x="40" y="1480" width="1520" height="620" rx="10" class="box gate"/>
  <text x="60" y="1512" class="h2" font-size="19">Grading &amp; Points Allocation — full breakdown</text>

  <text x="60" y="1548" class="lbl" font-weight="700">1) Per-question confidence score (ConfidenceAgent) — scale 0–100, pass bar = 80.0</text>
  <g transform="translate(60,1560)">
    <rect width="290" height="50" class="box" fill="#ffffff"/><text x="14" y="30" class="small">coverage</text><text x="14" y="45" class="tiny">20 pts</text>
    <rect x="300" width="290" height="50" class="box" fill="#ffffff"/><text x="314" y="30" class="small">difficulty</text><text x="314" y="45" class="tiny">20 pts</text>
    <rect x="600" width="290" height="50" class="box" fill="#ffffff"/><text x="614" y="30" class="small">originality</text><text x="614" y="45" class="tiny">20 pts</text>
    <rect x="900" width="290" height="50" class="box" fill="#ffffff"/><text x="914" y="30" class="small">format_quality</text><text x="914" y="45" class="tiny">20 pts</text>
    <rect x="1200" width="290" height="50" class="box" fill="#ffffff"/><text x="1214" y="30" class="small">eval_calibration</text><text x="1214" y="45" class="tiny">20 pts</text>
  </g>
  <text x="60" y="1638" class="small" font-weight="700">Total = 100 pts · question keeps if score ≥ 80</text>
  <text x="60" y="1660" class="tiny" fill="#8a5a00">Note: "auto_grading" field exists in the schema but is hardcoded to 0 — sandboxed/executable grading (sandbox/harness.py) is built but not wired into scoring.</text>

  <line x1="60" y1="1682" x2="1540" y2="1682" stroke="#bbb"/>

  <text x="60" y="1712" class="lbl" font-weight="700">2) Quality-bar gate (PlannerAgent.evaluate_quality) — ALL must pass, every validate round</text>
  <text x="80" y="1736" class="small">• min_confidence ≥ 80.0</text>
  <text x="80" y="1756" class="small">• max_similarity ≤ 0.60 (vs any past question in the vectorstore)</text>
  <text x="80" y="1776" class="small">• require_in_scope = true (question must map to a real syllabus skill)</text>
  <text x="80" y="1796" class="small">• min_difficulty_fit ≥ 0.6</text>
  <text x="80" y="1816" class="small">• require_judge_approve = false (in-loop LLM judge not mandatory by default)</text>

  <line x1="60" y1="1838" x2="1540" y2="1838" stroke="#bbb"/>

  <text x="60" y="1866" class="lbl" font-weight="700">3) Package-level final audit (SupervisorAgent)</text>
  <text x="80" y="1888" class="small">• supervisor_min_validation_score ≥ 75</text>
  <text x="80" y="1908" class="small">• coverage_target ≥ 0.85 (at least 85% of extracted syllabus skills must be covered)</text>
  <text x="80" y="1928" class="small">• at least 1 approved question required, else whole package REJECTED</text>
  <text x="80" y="1948" class="small">• optional post-loop LLM judge (enable_llm_judge, disabled by default) for a second opinion</text>

  <line x1="60" y1="1970" x2="1540" y2="1970" stroke="#bbb"/>

  <text x="60" y="1998" class="lbl" font-weight="700">4) Human review (optional, borderline band)</text>
  <text x="80" y="2020" class="small">confidence 82–87% → surfaced for a human decision.  log = continue (treated approved) · defer = excluded, logged · block = halt run, exit code 2</text>

  <line x1="60" y1="2042" x2="1540" y2="2042" stroke="#bbb"/>

  <text x="60" y="2070" class="lbl" font-weight="700">5) Model → cost table (config/config.yaml pricing, $ per 1M tokens, in / out)</text>
  <g transform="translate(60,2082)">
    <rect width="740" height="40" class="box" fill="#ffffff"/><text x="12" y="25" class="small">openai/gpt-4.1 — primary: generator + supervisor</text><text x="600" y="25" class="small" font-weight="700">$2.00 / $8.00</text>
    <rect y="44" width="740" height="40" class="box" fill="#ffffff"/><text x="12" y="69" class="small">openai/gpt-4.1-mini — difficulty, eval, md_summary</text><text x="600" y="69" class="small" font-weight="700">$0.40 / $1.60</text>
    <rect x="760" width="740" height="40" class="box" fill="#ffffff"/><text x="772" y="25" class="small">google/gemini-2.5-flash-lite — triage, scope_quality</text><text x="1360" y="25" class="small" font-weight="700">$0.10 / $0.40</text>
    <rect x="760" y="44" width="740" height="40" class="box" fill="#ffffff"/><text x="772" y="69" class="small">openai/gpt-4o · anthropic/claude-sonnet-4-6</text><text x="1360" y="69" class="small" font-weight="700">$2.50/$10 · $3/$15</text>
  </g>

  <!-- ARROWS: main vertical spine -->
  <path d="M370,305 L410,305" class="edge"/>
  <path d="M740,305 L780,305" class="edge"/>
  <path d="M1160,305 L1200,305" class="edge"/>
  <path d="M1170,390 L1170,420" class="edge"/>
  <path d="M1170,480 L1170,520" class="edge"/>
  <path d="M540,820 L540,860" class="edge"/>
  <path d="M1320,820 L1320,860" class="edge"/>

  <!-- decide -> branches -->
  <path d="M300,930 L270,960" class="edgeRed"/>
  <text x="150" y="945" class="flowlabel">REGENERATE</text>

  <path d="M900,930 L900,960" class="edge"/>
  <text x="905" y="945" class="flowlabel">NEXT_BATCH → back to step 3</text>

  <path d="M1320,930 L1320,960" class="edge"/>
  <text x="1250" y="945" class="flowlabel">FINALIZE</text>

  <!-- reflect -> regenerate -->
  <path d="M500,1030 L540,1030" class="edge"/>

  <!-- regenerate -> validate (loop back, dashed) -->
  <path d="M770,960 L770,900 L680,900 L680,820" class="edgeRed"/>
  <text x="700" y="895" class="tiny" fill="#b3261e">loop back to validate</text>

  <!-- NEXT_BATCH loop back to generate -->
  <path d="M1450,860 L1450,500 L1160,500 L1160,390" class="edgeRed"/>

  <!-- supervise -> memory/vectorstore -->
  <path d="M1195,1160 L1195,1220" class="edge"/>
  <path d="M1445,1160 L1445,1220" class="edge"/>

  <!-- supervise -> export -->
  <path d="M1080,1060 L1040,1160 L1040,1220" class="edge"/>

  <!-- export -> safety bounds -->
  <path d="M540,1320 L540,1360" class="edge"/>
</svg>
